<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scan Image - SymptoTrack Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth-guard.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0B132B;
            background: radial-gradient(circle at 50% 0%, #162447 0%, #0B132B 70%);
            color: #FFFFFF;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 18px;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            margin-top: 8px;
        }
        .btn-back-link {
            color: #FFFFFF;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
        }
        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.4px;
        }

        .scan-card {
            background: rgba(19, 28, 49, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .drop-zone {
            border: 2px dashed rgba(59, 130, 246, 0.4);
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.6);
            height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 20px;
        }

        .btn-action-tile {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #F3F4F6;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action-tile:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3B82F6;
        }

        .btn-analyze-main {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: #2563EB;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
        }
        .btn-analyze-main:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ── Live Camera Modal ── */
        .camera-modal {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 23, 0.95);
            backdrop-filter: blur(16px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .camera-modal.active {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- App Header -->
        <header class="app-header">
            <a href="dashboard.html" class="btn-back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="header-title">Scan Image</div>
        </header>

        <div class="scan-card">
            <!-- Drop Zone & Preview Container -->
            <div class="drop-zone" id="dropZone">
                <div class="placeholder-content" id="placeholderContent" style="text-align: center; padding: 20px;">
                    <div style="width: 56px; height: 56px; background: rgba(59, 130, 246, 0.15); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; color: #38BDF8;">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    </div>
                    <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 4px; color: #F3F4F6;">Upload Prescription or Lab Image</h3>
                    <p style="font-size: 12px; color: #94A3B8; margin: 0;">Tap to select or drop image</p>
                </div>
                <img id="imagePreview" class="preview-img" alt="Scan Target">
            </div>

            <!-- Action Buttons -->
            <div class="action-grid">
                <button class="btn-action-tile" id="btnTakePhoto">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    CAPTURE
                </button>
                <button class="btn-action-tile" id="btnUploadFile">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C084FC" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    UPLOAD
                </button>
            </div>

            <!-- Hidden Inputs -->
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            <input type="file" id="uploadInput" accept="image/*" style="display: none;">

            <button class="btn-analyze-main" id="btnAnalyzeImage" disabled>START AI SCAN DIAGNOSIS</button>
        </div>
    </div>

    <!-- Live Camera Viewfinder Modal -->
    <div class="camera-modal" id="cameraModal">
        <div style="font-size: 18px; font-weight: 800; margin-bottom: 14px; color: #FFF;">📷 Live Camera Viewfinder</div>
        <video id="webcamVideo" autoplay playsinline style="width: 100%; max-width: 440px; border-radius: 18px; border: 2px solid #3B82F6; background: #000;"></video>
        <div style="display: flex; gap: 12px; margin-top: 18px; width: 100%; max-width: 440px;">
            <button id="btnCaptureSnap" style="flex: 2; background: #2563EB; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer;">SNAP PHOTO 📸</button>
            <button id="btnCloseCamera" style="flex: 1; background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer;">CANCEL</button>
        </div>
        <canvas id="snapCanvas" style="display: none;"></canvas>
    </div>

    <script src="scan.js"></script>

    <!-- Mobile App Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="symptoms.html" class="nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <span>Symptoms</span>
        </a>
        <a href="history.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>History</span>
        </a>
        <a href="nearby.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>Nearby</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
