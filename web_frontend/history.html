<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Symptom History - SymptoTrack Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth-guard.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0B132B;
            background: radial-gradient(circle at 50% 0%, #162447 0%, #0B132B 70%);
            color: #FFFFFF;
            min-height: 100vh;
            padding-bottom: 90px;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 18px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            margin-top: 8px;
        }
        .btn-back-link {
            color: #FFFFFF;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
        }
        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.4px;
        }
        .history-card {
            background: rgba(19, 28, 49, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- App Header -->
        <header class="app-header">
            <div style="display:flex; align-items:center; gap:12px;">
                <a href="dashboard.html" class="btn-back-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </a>
                <div class="header-title">Symptom History</div>
            </div>
            <button id="btnClearAll" style="background:none; border:none; color:#EF4444; font-weight:800; font-size:13px; cursor:pointer;">Clear All</button>
        </header>

        <main>
            <div id="historyList">
                <!-- Sample History Item 1 -->
                <div class="history-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-size:15px; font-weight:800; color:#FFF;">Headache & Mild Fever</span>
                        <span style="font-size:11px; color:#94A3B8;">Today, 10:30 AM</span>
                    </div>
                    <p style="font-size:13px; color:#94A3B8; margin-bottom:10px;">Throbbing sensation in forehead after long screen exposure.</p>
                    <span style="background:rgba(59,130,246,0.15); color:#38BDF8; font-size:11px; font-weight:700; padding:4px 10px; border-radius:12px;">AI Diagnosis: Tension Headache</span>
                </div>

                <!-- Sample History Item 2 -->
                <div class="history-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-size:15px; font-weight:800; color:#FFF;">Seasonal Allergies</span>
                        <span style="font-size:11px; color:#94A3B8;">Yesterday</span>
                    </div>
                    <p style="font-size:13px; color:#94A3B8; margin-bottom:10px;">Sneezing and watery eyes during outdoor walk.</p>
                    <span style="background:rgba(168,85,247,0.15); color:#C084FC; font-size:11px; font-weight:700; padding:4px 10px; border-radius:12px;">AI Diagnosis: Allergic Rhinitis</span>
                </div>
            </div>
        </main>

    </div>

    <script src="history.js"></script>

    <!-- Mobile App Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="symptoms.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <span>Symptoms</span>
        </a>
        <a href="history.html" class="nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>History</span>
        </a>
        <a href="nearby.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>Nearby</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
