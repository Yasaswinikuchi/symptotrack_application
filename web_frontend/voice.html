<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Symptoms - SymptoTrack Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth-guard.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0B132B;
            background: radial-gradient(circle at 50% 0%, #162447 0%, #0B132B 70%);
            color: #FFFFFF;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 18px;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            margin-top: 8px;
        }
        .btn-back-link {
            color: #FFFFFF;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
        }
        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.4px;
        }

        .voice-card {
            background: rgba(19, 28, 49, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .mic-btn-main {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: #2563EB;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px auto;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
            transition: all 0.2s ease;
        }

        .preset-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #D1D5DB;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin: 4px;
        }

        .transcript-text {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px;
            color: #FFFFFF;
            font-size: 14px;
            min-height: 90px;
            text-align: left;
            margin-top: 16px;
            outline: none;
        }

        .btn-analyze-voice {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: #2563EB;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- App Header -->
        <header class="app-header">
            <a href="dashboard.html" class="btn-back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="header-title">Voice Symptoms</div>
        </header>

        <div class="voice-card">
            <h3 style="font-size: 17px; font-weight: 800; color: #FFF; margin-bottom: 4px;">Speak Your Symptoms</h3>
            <p style="font-size: 12px; color: #94A3B8;">Tap the microphone button to start recording your symptoms</p>

            <button class="mic-btn-main" id="btnMic">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
            </button>

            <div style="margin-top: 12px;">
                <button class="preset-pill" onclick="insertSample('I have had a high fever and severe headache for 2 days.')">🤒 Fever & Headache</button>
                <button class="preset-pill" onclick="insertSample('Persistent dry cough and sore throat.')">😮‍💨 Cough & Throat</button>
            </div>

            <div class="transcript-text" id="transcriptText" contenteditable="true" placeholder="Spoken transcript will appear here..."></div>

            <button class="btn-analyze-voice" id="btnAnalyzeVoice">
                ANALYZE VOICE SYMPTOMS
            </button>
        </div>
    </div>

    <script src="voice.js?v=20260806_v3"></script>
    <script>
        function insertSample(text) {
            const el = document.getElementById('transcriptText');
            if (el) el.innerText = text;
            const btn = document.getElementById('btnAnalyzeVoice');
            if (btn) btn.disabled = false;
        }
    </script>

    <!-- Mobile App Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="symptoms.html" class="nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <span>Symptoms</span>
        </a>
        <a href="history.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>History</span>
        </a>
        <a href="nearby.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>Nearby</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
