<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enter Symptoms - SymptoTrack Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth-guard.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0B132B;
            background: radial-gradient(circle at 50% 0%, #162447 0%, #0B132B 70%);
            color: #FFFFFF;
            min-height: 100vh;
            padding-bottom: 90px;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 18px;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            margin-top: 8px;
        }
        .btn-back-link {
            color: #FFFFFF;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
        }
        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.4px;
        }

        .form-section-card {
            background: rgba(19, 28, 49, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: #94A3B8;
            display: block;
            margin-bottom: 8px;
        }
        .symptoms-textarea {
            width: 100%;
            height: 120px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            resize: vertical;
        }
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }
        .form-input-dark {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px;
            color: #FFFFFF;
            font-size: 14px;
            outline: none;
        }

        /* ── Chips Container ── */
        .chips-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 44px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            align-items: center;
            margin-bottom: 10px;
        }

        .chip-tag {
            background: #2563EB;
            color: #FFFFFF;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chip-tag .close-btn {
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            opacity: 0.8;
        }
        .chip-tag .close-btn:hover { opacity: 1; }

        .btn-add-condition-modal {
            background: #2563EB;
            color: #FFFFFF;
            border: none;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .preset-pills-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .pill-preset {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #38BDF8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-preset:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: translateY(-1px);
        }

        .btn-analyze-blue {
            width: 100%;
            background: #2563EB;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }
        .btn-analyze-blue:hover {
            background: #1D4ED8;
            transform: translateY(-2px);
        }

        /* ── Modal for Custom Condition ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal.open { display: flex; }

        .modal-box {
            background: #0F172A;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            color: #FFF;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- App Header -->
        <header class="app-header">
            <a href="dashboard.html" class="btn-back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="header-title">Enter Symptoms</div>
        </header>

        <main>
            <!-- Describe Feel Card -->
            <div class="form-section-card">
                <label class="form-label">Describe how you feel</label>
                <textarea class="symptoms-textarea" id="symptomsText" placeholder="E.g., I've been having a severe headache since yesterday morning along with mild fever..."></textarea>
            </div>

            <!-- Patient Details Card -->
            <div class="form-section-card">
                <h3 style="font-size: 16px; font-weight: 800; color: #FFF; margin-bottom: 14px;">Patient Details</h3>
                
                <div class="input-row">
                    <div>
                        <label class="form-label">Age</label>
                        <input type="number" id="patientAge" class="form-input-dark" placeholder="25" value="25">
                    </div>
                    <div>
                        <label class="form-label">Gender</label>
                        <select id="patientGender" class="form-input-dark" style="background:#131C31;">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div>
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                        <label class="form-label" style="margin:0;">Pre-existing Conditions</label>
                        <button type="button" class="btn-add-condition-modal" onclick="openConditionModal()">+ Add Condition</button>
                    </div>

                    <!-- Interactive Chips Box -->
                    <div class="chips-wrapper" id="chipsWrapper">
                        <span style="font-size: 12px; color: #94A3B8;" id="noChipsHint">No conditions added yet (click preset or + Add Condition)</span>
                    </div>

                    <div class="preset-pills-row">
                        <button type="button" class="pill-preset" onclick="addConditionChip('Asthma')">+ Asthma</button>
                        <button type="button" class="pill-preset" onclick="addConditionChip('Diabetes')">+ Diabetes</button>
                        <button type="button" class="pill-preset" onclick="addConditionChip('Hypertension')">+ Hypertension</button>
                        <button type="button" class="pill-preset" onclick="addConditionChip('Dust Allergy')">+ Dust Allergy</button>
                        <button type="button" class="pill-preset" onclick="openConditionModal()">+ Custom...</button>
                    </div>
                </div>
            </div>

            <!-- Analyze Button -->
            <button class="btn-analyze-blue" id="analyzeBtn" onclick="runAIAnalysis()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                Analyze Symptoms with AI
            </button>
        </main>

    </div>

    <!-- Modal for Adding Custom Condition -->
    <div class="modal" id="conditionModal">
        <div class="modal-box">
            <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 14px; color: #FFF;">Add Pre-existing Condition</h2>
            <div style="margin-bottom: 16px;">
                <label style="font-size: 12px; color: #94A3B8; display: block; margin-bottom: 6px; font-weight: 700;">Condition Name *</label>
                <input type="text" id="customCondInput" placeholder="e.g. Thyroid, Migraine, Sinusitis" style="width: 100%; background: #1E293B; border: 1px solid rgba(255,255,255,0.15); color: #FFF; padding: 12px; border-radius: 12px; font-size: 14px; outline: none;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeConditionModal()" style="flex: 1; padding: 12px; background: rgba(255,255,255,0.08); border: none; color: #94A3B8; border-radius: 12px; font-weight: 800; cursor: pointer;">Cancel</button>
                <button onclick="saveCustomCondition()" style="flex: 1; padding: 12px; background: #2563EB; border: none; color: #FFF; border-radius: 12px; font-weight: 800; cursor: pointer;">Add</button>
            </div>
        </div>
    </div>

    <script src="ml.js"></script>
    <script src="symptoms.js"></script>

    <!-- Mobile App Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="symptoms.html" class="nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <span>Symptoms</span>
        </a>
        <a href="history.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>History</span>
        </a>
        <a href="nearby.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>Nearby</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
