name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Line Endings & Build Android Debug APK
        run: |
          cd app_frontend
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || true

      - name: Setup Python & Dependencies
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Automation Libraries
        run: |
          pip install openpyxl requests

      - name: Generate Appium E2E Reports
        run: |
          python web_frontend/generate_reports.py

      - name: Upload Android Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Android-Appium-Reports
          path: |
            web_frontend/Test_Results/
          retention-days: 30

      - name: Publish GitHub Action Execution Summary
        if: always()
        run: |
          cat web_frontend/Test_Results/Summary/summary.md >> $GITHUB_STEP_SUMMARY
