name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          cd app_frontend
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Setup Node.js & Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UIAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Setup Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Automation Libraries
        run: |
          pip install Appium-Python-Client openpyxl requests

      - name: Generate Appium E2E Reports
        run: |
          python web_frontend/generate_reports.py

      - name: Upload Android Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Appium-Reports
          path: |
            web_frontend/Test Results/
            app_frontend/app/build/outputs/apk/debug/
          retention-days: 30
