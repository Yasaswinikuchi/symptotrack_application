name: Backend Security Assessment & k6 Load Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-and-load-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Run Backend Security Assessment & Report Generation
        run: |
          python web_frontend/generate_reports.py

      - name: Setup k6 Load Testing Engine
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3CE19D54A84514109B97D00E15A0D || true

      - name: Upload Security & Performance Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Security-Performance-Reports
          path: |
            web_frontend/Test_Results/
            web_frontend/Vulnerability_Test_Results/
          retention-days: 30

      - name: Publish GitHub Action Execution Summary
        if: always()
        run: |
          cat web_frontend/Test_Results/Summary/summary.md >> $GITHUB_STEP_SUMMARY
